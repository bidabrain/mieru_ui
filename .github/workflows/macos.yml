name: macos

on:
  push:
    tags: ["macos-v*"]
    branches: [main]
    paths:
      - "macos/**"
      - "android/core/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: macos/core/go.mod
          cache-dependency-path: |
            macos/core/go.sum
            android/core/go.sum

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF_NAME" == macos-v* ]]; then V="${GITHUB_REF_NAME#macos-v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test core
        run: |
          (cd macos/core && go vet -tags with_gvisor ./... && go test -tags with_gvisor ./...)
          (cd android/core && go test -tags with_gvisor ./...)

      - name: Build app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          swift --version
          if ! bash macos/build.sh > build.log 2>&1; then
            cat build.log
            # surface compiler errors as annotations (readable without downloading logs)
            errs=$(grep -E 'error:|FAILED|fatal' build.log | sed 's#^.*/macos/##' | sort -u | head -80)
            echo "::error title=build errors::$(printf '%s' "$errs" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            echo "::error title=build tail::$(tail -c 2500 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi
          cat build.log

      - name: Smoke test
        run: |
          APP=macos/build/Mieru.app
          file "$APP/Contents/MacOS/Mieru" "$APP/Contents/MacOS/mieru-core"
          lipo -archs "$APP/Contents/MacOS/Mieru" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/Mieru" | grep -q arm64
          "$APP/Contents/MacOS/mieru-core" version
          echo '{"text":"mierus://u:p@example.com?port=2012&protocol=TCP&profile=t"}' \
            | "$APP/Contents/MacOS/mieru-core" call parse | tee /dev/stderr | grep -q '"ok":true'
          # the daemon serves the API on a unix socket (runs unprivileged here; only start needs root)
          "$APP/Contents/MacOS/mieru-core" daemon -socket /tmp/mc.sock -data /tmp/mc-data -seed "$APP/Contents/Resources/geo" & DPID=$!
          for i in $(seq 1 40); do [ -S /tmp/mc.sock ] && break; sleep 0.25; done
          curl -sf --unix-socket /tmp/mc.sock -X POST http://x/status | tee /dev/stderr | grep -q '"daemon":true'
          kill $DPID
          # the GUI starts and stays up
          "$APP/Contents/MacOS/Mieru" & PID=$!
          sleep 8
          kill -0 $PID
          kill $PID

      - name: End-to-end test (root daemon, real tun)
        run: |
          set -x
          APP=macos/build/Mieru.app
          SOCK=/tmp/mc-root.sock
          SVC=$(networksetup -listallnetworkservices | sed 1d | grep -v '^\*' | head -1)
          networksetup -getdnsservers "$SVC" | tee /tmp/dns-before
          sudo "$APP/Contents/MacOS/mieru-core" daemon -socket $SOCK -data /tmp/mc-root -owner "$(id -u)" \
            -seed "$APP/Contents/Resources/geo" > /tmp/core.log 2>&1 &
          for i in $(seq 1 40); do [ -S $SOCK ] && break; sleep 0.25; done
          api() { curl -sf --unix-socket $SOCK -X POST "http://x/$1" -d "${2:-{\}}"; echo; }
          trap 'cat /tmp/core.log; api logs "{\"after\":0}" | head -c 6000' EXIT
          # direct mode: everything goes through the tun and out directly, so the runner keeps working
          OPTS='{"profile":{"name":"t","server":"127.0.0.1","username":"u","password":"p","bindings":[{"port":2012,"protocol":"TCP"}]},
                 "routing":{"mode":"direct","bypassLan":true,"directDns":["https://doh.pub/dns-query","223.5.5.5"],"remoteDns":["https://1.1.1.1/dns-query"],"fakeIp":true,"sniff":true},
                 "stack":"gvisor","logLevel":"info","mixedPort":17890,"desktop":{"perAppMode":"off","apps":[]}}'
          api start "{\"options\":$OPTS}" | tee /dev/stderr | grep -q '"result":true'
          api status | grep -q '"running":true'
          ifconfig | grep -A3 '^utun' | grep -q 198.18.0.1
          networksetup -getdnsservers "$SVC" | grep -qx 198.18.0.2
          # resolves through the hijacked DNS (fake-ip) and connects through the tun
          dig +short +time=5 www.gstatic.com @198.18.0.2 | tee /dev/stderr | grep -q '^198\.18\.'
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.gstatic.com/generate_204)
          [ "$code" = 204 ]
          # and through the local mixed port
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -x http://127.0.0.1:17890 https://www.gstatic.com/generate_204)
          [ "$code" = 204 ]
          api traffic | tee /dev/stderr | grep -q '"downTotal":[1-9]'
          api stop | grep -q '"ok":true'
          sleep 1
          if ifconfig | grep -A3 '^utun' | grep -q 198.18.0.1; then echo "tun still up"; exit 1; fi
          networksetup -getdnsservers "$SVC" | diff - /tmp/dns-before
          sudo pkill -f "mieru-core daemon -socket $SOCK"
          trap - EXIT

      - name: Collect
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cp "macos/build/Mieru-$V.dmg" "macos/build/Mieru-$V.zip" dist/
          (cd dist && shasum -a 256 * > SHA256SUMS-macos && cat SHA256SUMS-macos)

      - uses: actions/upload-artifact@v4
        with:
          name: mieru-macos-${{ steps.ver.outputs.version }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/macos-v')
        with:
          name: Mieru macOS ${{ steps.ver.outputs.version }}
          # Keep "latest" pointing at the panel release: install.sh resolves releases/latest.
          make_latest: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos
          body: |
            Mieru macOS 客户端 ${{ steps.ver.outputs.version }}（Apple 芯片与 Intel 通用，macOS 13+）

            - 下载 `.dmg`，打开后把 Mieru 拖进「应用程序」。
            - 应用未经 Apple 公证：首次打开请在「应用程序」里右键 Mieru → 打开；或执行 `xattr -dr com.apple.quarantine /Applications/Mieru.app`。
            - 首次连接时按提示安装「核心服务」（需要一次管理员密码，用于创建虚拟网卡）。
            - 关闭窗口后 Mieru 留在菜单栏，可在菜单栏图标中连接/断开、切换节点和分流模式。
